# Upstream tracker registry — the version-controlled input that drives the tracker.
#
# Each entry describes one tracked repo:
#   name:                            upstream "owner/repo" short id
#   upstream:                        upstream GitHub URL we watch for new tags
#   canonical_repo:                  our Canonical fork on GitHub
#   canonical_branch:                the fork's release branch
#   canonical_tag:                   latest Canonical release tag on that branch
#   last_incorporated_upstream_ref:  newest upstream ref already merged into the
#                                    fork; the tracked line is implied by it
#                                    (e.g. v1.14.6 => we track v1.14.*)

repos:
  - name: containernetworking/plugins
    upstream: https://github.com/containernetworking/plugins
    canonical_repo: https://github.com/canonical/mx-containernetworking-plugins
    canonical_branch: canonical/1.9-26.04/stable
    canonical_tag: v1.9.5-canonical-26.04-stable
    last_incorporated_upstream_ref: v1.9.1

  - name: containerd/containerd
