name: Nightly release tracker

on:
  schedule:
    # 09:00 UTC daily (spec: recommended starting point).
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # allow manual re-trigger

permissions:
  contents: write   # to commit updated registry + state snapshot

concurrency:
  group: release-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      # One job per K8s release set. Add "1.33"–"1.35" here as their registries
      # land (registries/upstream-tracker-<set>.yaml).
      matrix:
        release_set: ["1.36", "1.37"]
      # A failing set must not cancel the others.
      fail-fast: false
      # Serialize so the two jobs' registry/state commits never race on a
      # concurrent push (each job checks out after the previous one's push).
      max-parallel: 1
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_MODEL: google/gemini-2.5-pro
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tracker
        run: uv run python -m tracker.main ${{ matrix.release_set }}

      - name: Upload report artifact
        # Makes report.md + report.json downloadable from the run page in the
        # GitHub UI. Quiet runs produce no report, so a missing dir is fine.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report-${{ matrix.release_set }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist registry + processed-tag state
        run: |
          if [[ -n "$(git status --porcelain registries/ state/)" ]]; then
            git config user.name "release-tracker-bot"
            git config user.email "release-tracker-bot@users.noreply.github.com"
            git add registries/ state/
            git commit -m "chore: update tracker registry + processed state (${{ matrix.release_set }}) [skip ci]"
            # Rebase onto any commit the previous matrix set pushed, then push.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
