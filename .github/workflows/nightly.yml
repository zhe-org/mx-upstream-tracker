name: Nightly release tracker

on:
  schedule:
    # 09:00 UTC daily (spec: recommended starting point).
    - cron: "0 9 * * *"
  workflow_dispatch: {} # allow manual re-trigger

permissions:
  contents: read

concurrency:
  group: release-tracker
  cancel-in-progress: false

env:
  # Rolling PR branch: rebuilt from main on every run that finds new tags and
  # carries the state/ + reports/ updates still waiting to be merged. The
  # workflow never pushes to main.
  PR_BRANCH: tracker/nightly

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      # One job per K8s release set, one registry each
      # (registries/upstream-tracker-<set>.yaml). Keep this list in sync with
      # registries/ — tests/test_shipped_registries.py fails CI if it drifts.
      matrix:
        release_set: ["1.33", "1.34", "1.35", "1.36", "1.37", "1.38"]
      # A failing set must not cancel the others.
      fail-fast: false
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_MODEL: google/gemini-2.5-pro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Start from the watermark/report the open tracker PR already holds, so
      # tags found on earlier nights are not reported again before it merges.
      - uses: ./.github/actions/overlay-pending
        with:
          branch: ${{ env.PR_BRANCH }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tracker
        run: uv run python -m tracker.main ${{ matrix.release_set }}

      - name: Upload tracker output
        # Only a run that found new tags writes artifacts/report-<set>.json
        # (this run's tags, for the notification) and updates state/ +
        # reports/ (watermark + 7-day report, for the PR).
        if: hashFiles('artifacts/report-*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tracker-${{ matrix.release_set }}
          path: |
            artifacts/report-*.json
            state/
            reports/
          retention-days: 7

  pr:
    # Fold every set's output into the rolling PR. Runs even if one set failed
    # (fail-fast: false), but not on cancel.
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      # PAT: pushes and the PR it opens trigger CI and the preview deployment
      # (events created with the default GITHUB_TOKEN would not).
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    outputs:
      found: ${{ steps.changes.outputs.found }}
      pr_url: ${{ steps.pr.outputs.url }}
      preview_url: ${{ steps.pr.outputs.preview_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: ./.github/actions/overlay-pending
        with:
          branch: ${{ env.PR_BRANCH }}

      - name: Collect set outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: tracker-*
          merge-multiple: true

      - name: Detect new tags
        id: changes
        run: |
          if compgen -G "artifacts/report-*.json" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Quiet run: no new tags on any set; no PR update."
          fi

      - name: Push rolling branch
        if: steps.changes.outputs.found == 'true'
        run: |
          git config user.name "release-tracker-bot"
          git config user.email "release-tracker-bot@users.noreply.github.com"
          git switch -C "$PR_BRANCH"
          git add state/ reports/
          git commit -m "chore: record upstream tracker results (run ${{ github.run_number }})"
          git push --force origin "$PR_BRANCH"

      - name: Open or update PR
        id: pr
        if: steps.changes.outputs.found == 'true'
        run: |
          number=$(gh pr list --head "$PR_BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh pr create --base main --head "$PR_BRANCH" \
              --title "chore: upstream tracker results" \
              --body "New upstream tags found by the nightly tracker. Merging records the last-scanned watermark (state/) and the 7-day report (reports/) on main. This branch is rebuilt from main on every run that finds new tags."
            number=$(gh pr list --head "$PR_BRANCH" --base main --state open --json number --jq '.[0].number')
          fi
          # Internal repos serve Pages from a random host, so ask the API.
          pages=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)
          {
            echo "url=$(gh pr view "$number" --json url --jq .url)"
            echo "preview_url=${pages%/}/pr-preview/pr-${number}/"
          } >> "$GITHUB_OUTPUT"

  notify:
    # One brief Mattermost message across all sets, linking the PR preview.
    needs: pr
    if: ${{ !cancelled() && needs.pr.outputs.found == 'true' }}
    runs-on: ubuntu-latest
    env:
      MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Download this run's reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: tracker-*
          merge-multiple: true
          path: _run

      - name: Post Mattermost notification
        # No-ops cleanly if the webhook secret is unset.
        run: >
          uv run python -m tracker.notify _run/artifacts
          --preview-url "${{ needs.pr.outputs.preview_url }}"
          --pr-url "${{ needs.pr.outputs.pr_url }}"
