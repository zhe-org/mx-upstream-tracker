name: Nightly release tracker

on:
  schedule:
    # 09:00 UTC daily (spec: recommended starting point).
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # allow manual re-trigger

permissions:
  contents: write   # to commit updated registry + state snapshot
  issues: write     # to post the report as an issue (Milestone 7)

concurrency:
  group: release-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      LLM_MODEL: gemini-2.5-pro
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tracker
        # One release set for now; a matrix over registries/ lands with M7.
        run: uv run python -m tracker.main 1.36

      - name: Persist registry + processed-tag state
        run: |
          if [[ -n "$(git status --porcelain registries/ state/)" ]]; then
            git config user.name "release-tracker-bot"
            git config user.email "release-tracker-bot@users.noreply.github.com"
            git add registries/ state/
            git commit -m "chore: update tracker registry + processed state [skip ci]"
            git push
          fi
