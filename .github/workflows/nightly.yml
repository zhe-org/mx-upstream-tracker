name: Nightly release tracker

on:
  schedule:
    # 09:00 UTC daily (spec: recommended starting point).
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # allow manual re-trigger

permissions:
  contents: read

concurrency:
  group: release-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit updated registry + state snapshot
    strategy:
      # One job per K8s release set, one registry each
      # (registries/upstream-tracker-<set>.yaml). Keep this list in sync with
      # registries/ — tests/test_shipped_registries.py fails CI if it drifts.
      matrix:
        release_set: ["1.33", "1.34", "1.35", "1.36", "1.37"]
      # A failing set must not cancel the others.
      fail-fast: false
      # Serialize so the sets' registry/state commits never race on a
      # concurrent push (each job checks out after the previous one's push).
      max-parallel: 1
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_MODEL: google/gemini-2.5-pro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tracker
        run: uv run python -m tracker.main ${{ matrix.release_set }}

      - name: Upload report artifact
        # report.md/json/meta.json (always written, even on a quiet run) become
        # downloadable from the run page and feed the Pages publish job below.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-report-${{ matrix.release_set }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist registry + processed-tag state
        run: |
          if [[ -n "$(git status --porcelain registries/ state/)" ]]; then
            git config user.name "release-tracker-bot"
            git config user.email "release-tracker-bot@users.noreply.github.com"
            git add registries/ state/
            git commit -m "chore: update tracker registry + processed state (${{ matrix.release_set }}) [skip ci]"
            # Rebase onto any commit the previous matrix set pushed, then push.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

  publish:
    # Aggregate every set's report into one HTML page and deploy it to Pages.
    needs: run
    # Publish even if one set failed (fail-fast: false), but not on cancel.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write       # deploy the site
      id-token: write    # OIDC token for the Pages deployment
      actions: read      # download this run's artifacts
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      # Expose the deployed page URL so the notify job can link to it.
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Download all set reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-report-*-${{ github.run_number }}
          path: _reports

      - name: Build site
        run: uv run python -m tracker.site _reports site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  notify:
    # Post one brief Mattermost message across all sets, after the page is live.
    needs: [run, publish]
    # Notify even if one set failed (fail-fast: false), but not on cancel.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read      # download this run's artifacts
      contents: read
    env:
      MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Download all set reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-report-*-${{ github.run_number }}
          path: _reports

      - name: Post Mattermost notification
        # No-ops cleanly if the webhook secret is unset or the run was quiet.
        run: uv run python -m tracker.notify _reports --page-url "${{ needs.publish.outputs.page_url }}"
