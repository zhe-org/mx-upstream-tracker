# Repo registry — the version-controlled input that drives the tracker.
# Full schema + validation land in Milestone 1; this is a seed example.
#
# Each entry:
#   repo:            owner/name of the upstream project
#   upstream_url:    git URL of upstream
#   tracked_version: the minor / branch / constraint we track
#   fork_url:        git URL of our internal fork
#   last_merged_tag: the newest upstream tag already merged into our fork
#   reviewers:       optional owner/reviewer hints
#   areas_to_watch:  optional hotspots the sub-agent should be extra alert about

repos:
  - repo: kubernetes/kubernetes
    upstream_url: https://github.com/kubernetes/kubernetes
    tracked_version: 1.36.x
    fork_url: https://github.com/canonical/kubernetes  # placeholder
    last_merged_tag: v1.36.5
    reviewers: []
    areas_to_watch: [kubelet, CRI, "cgroups v2"]

  - repo: containerd/containerd
    upstream_url: https://github.com/containerd/containerd
    tracked_version: 2.0.x
    fork_url: https://github.com/canonical/containerd  # placeholder
    last_merged_tag: v2.0.0
    reviewers: []
    areas_to_watch: []

  - repo: containernetworking/plugins
    upstream_url: https://github.com/containernetworking/plugins
    tracked_version: 1.5.x
    fork_url: https://github.com/canonical/cni-plugins  # placeholder
    last_merged_tag: v1.5.1
    reviewers: []
    areas_to_watch: []

  - repo: coredns/coredns
    upstream_url: https://github.com/coredns/coredns
    tracked_version: 1.11.x
    fork_url: https://github.com/canonical/coredns  # placeholder
    last_merged_tag: v1.11.3
    reviewers: []
    areas_to_watch: []
