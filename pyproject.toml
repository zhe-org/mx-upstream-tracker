[project]
name = "k8s-upstream-tracker"
version = "0.1.0"
description = "AI workflow that tracks upstream Kubernetes-related releases and produces consolidated, risk-ranked merge review reports for our internal forks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.8",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
k8s-upstream-tracker = "tracker.main:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
